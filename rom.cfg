MEMORY 
{
    ZP:   start=$0, size=$100, type=rw, define=yes;
    RING: start=$200, size=$100, type=rw;
    LINE: start=$300, size=$100, type=rw;
    RAM:  start=$400, size=$7BFF, type=rw, define=yes;
    ACIA: start=$8800, size=$04, type=rw;
    ROM:  start=$c000, size=$4000, type=ro, define=yes, fill=yes, file=%O;
}

SEGMENTS 
{
    ZEROPAGE: load=ZP, type=zp;
    RING:     load=RING, type=bss;
    LINE:     load=LINE, type=bss;
    DATA:     load=RAM, type=rw, define=yes;
    ACIA:     load=ACIA, type=bss;
    SYSTEM:   load=ROM, type=ro;
    VECTORS:  load=ROM, type=ro, start=$FFFA;
}
